{% extends 'base.html' %}

{% block title %}Delete post{% endblock %}

{% block content %}
<main class="page page--narrow">
    <section>
            <h1>Delete this post?</h1>
            <p class="subtitle">“{{ post.title }}” will be permanently removed. This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-actions"><button type="submit">Delete post</button><a class="text-link" href="{% url 'my-posts' %}">Keep post</a></div>
            </form>
    </section>
</main>
{% endblock %}
