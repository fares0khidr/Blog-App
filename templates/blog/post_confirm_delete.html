{% extends 'base.html' %}

{% block title %}Delete post{% endblock %}

{% block content %}
    <section class="form-layout">
        <div class="confirm-panel">
            <p class="eyebrow">One last check</p>
            <h1>Delete this post?</h1>
            <p class="post-excerpt">“{{ post.title }}” will be permanently removed. This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-actions"><button type="submit">Delete post</button><a class="text-link" href="{% url 'my-posts' %}">Keep post</a></div>
            </form>
        </div>
    </section>
{% endblock %}
