{% extends "base.html" %}
{% block title %}Log in · TheBlog{% endblock %}
{% block content %}
<main class="auth"><h1>Log in</h1><p class="subtitle">Welcome back.</p><form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{% if form.errors %}<p class="auth-error">Wrong username or password. Try again.</p>{% endif %}<div class="field"><label for="id_username">Username</label><input class="input" type="text" id="id_username" name="username" autocomplete="username" autofocus required></div><div class="field"><label for="id_password">Password</label><input class="input" type="password" id="id_password" name="password" autocomplete="current-password" required></div><button class="btn btn--primary btn--block" type="submit" style="font-size:16px">Log in</button></form><p class="auth__alt">No account yet? <a href="{% url 'signup' %}">Sign up</a></p></main>
{% endblock %}
