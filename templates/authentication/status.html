{% extends 'base.html' %}

{% block title %}Authentication status{% endblock %}

{% block content %}
    <section class="form-layout">
        <div class="empty-state">
            {% if user.is_authenticated %}
                <p class="eyebrow">Session active</p>
                <h1>You are logged in as {{ user.username }}.</h1>
                <a class="button" href="{% url 'my-posts' %}">Open my posts</a>
            {% else %}
                <p class="eyebrow">Session inactive</p>
                <h1>You are not logged in.</h1>
                <a class="button" href="{% url 'login' %}">Log in</a>
            {% endif %}
        </div>
    </section>
{% endblock %}
