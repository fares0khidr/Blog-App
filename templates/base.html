{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TheBlog{% endblock %} | TheBlog</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="shell header-inner">
            <a class="brand" href="{% url 'post-list' %}">TheBlog</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="{% url 'post-list' %}">Posts</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'my-posts' %}">My posts</a>
                    <a class="nav-cta" href="{% url 'post-create' %}">New post <span aria-hidden="true">+</span></a>
                    <form class="logout-form" method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="nav-logout" type="submit">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Log in</a>
                    <a class="nav-cta" href="{% url 'signup' %}">Create account</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="shell">TheBlog &middot; Ideas worth sharing.</div>
    </footer>
</body>
</html>
